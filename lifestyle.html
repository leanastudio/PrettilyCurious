    <style>

        .life-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 140px;
        }

        /* ── Page hero ── */
        .life-hero {
            padding: 64px 0 60px;
            text-align: center;
        }
        .life-title {
            font-size: 72px;
            font-weight: 500;
            line-height: 1;
            margin-bottom: 12px;
        }
        .life-subtitle {
            font-size: 12px;
            opacity: 0.38;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── Chapter ── */
        .chapter {
            margin-bottom: 100px;
        }
        .chapter-header {
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(0,0,0,0.07);
        }
        .chapter-top {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 8px;
        }
        .chapter-name {
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.45;
        }
        .chapter-year {
            font-size: 10px;
            opacity: 0.22;
            letter-spacing: 0.06em;
        }
        .chapter-note {
            font-family: 'Caveat', cursive;
            font-size: 20px;
            font-weight: 400;
            opacity: 0.55;
            line-height: 1.3;
        }

        /* ── Masonry columns — natural photo proportions ── */
        .photo-cols {
            columns: 3;
            gap: 7px;
        }
        .photo-cols img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 7px;
            break-inside: avoid;
            transition: opacity 0.35s ease;
        }
        .photo-cols img:hover { opacity: 0.86; }

        .photo-cols.four { columns: 4; }

        /* ── Dark mode ── */
        [data-theme="dark"] .chapter-header { border-bottom-color: rgba(237,233,228,0.1); }
        [data-theme="dark"] .life-title { color: #ede9e4; }

        /* ── Responsive ── */
        @media (max-width: 1000px) {
            .photo-cols { columns: 2; }
            .photo-cols.four { columns: 3; }
        }
        @media (max-width: 600px) {
            .life-wrap { padding: 0 14px 100px; }
            .life-title { font-size: 52px; }
            .photo-cols { columns: 2; gap: 4px; }
            .photo-cols img { margin-bottom: 4px; }
            .photo-cols.four { columns: 2; }
        }

    </style>
</head>
