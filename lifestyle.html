    <style>

        .life-wrap {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px 140px;
        }

        /* ── Page hero ── */
        .life-hero {
            padding: 64px 0 60px;
            text-align: center;
        }
        .life-title {
            font-size: 72px;
            font-weight: 500;
            line-height: 1;
            margin-bottom: 12px;
        }
        .life-subtitle {
            font-size: 12px;
            opacity: 0.38;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── Chapter ── */
        .chapter {
            margin-bottom: 96px;
        }
        .chapter-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0,0,0,0.07);
        }
        .chapter-name {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.45;
        }
        .chapter-year {
            font-size: 10px;
            opacity: 0.22;
            letter-spacing: 0.06em;
        }

        /* ── Photo grid ── */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            grid-auto-rows: 280px;
        }

        .photo-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: opacity 0.4s ease;
        }
        .photo-grid img:hover { opacity: 0.88; }

        .photo-grid .wide { grid-column: span 2; }
        .photo-grid .tall { grid-row: span 2; }
        .photo-grid .big  { grid-column: span 2; grid-row: span 2; }

        /* Moments — 4 columns, tighter rows */
        .photo-grid.moments {
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 220px;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .photo-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 220px; }
            .photo-grid.moments { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 180px; }
            .life-title { font-size: 52px; }
        }
        @media (max-width: 540px) {
            .life-wrap { padding: 0 14px 100px; }
            .photo-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 160px; gap: 4px; }
            .photo-grid.moments { grid-template-columns: 1fr 1fr; grid-auto-rows: 150px; }
        }

    </style>
</head>
